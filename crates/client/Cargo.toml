[package]
name = "client"
version = "0.1.0"
edition = "2024"

[features]
default = ["dev"]
# Links Bevy dynamically, which makes a rebuild fast. A shipped build leaves it out
# (`cargo dist`), as a binary built with it needs `libbevy_dylib` beside it.
dev = ["bevy/dynamic_linking", "bevy/debug"]
# Records every system and render span for the Tracy profiler. It costs a lot of CPU and grows
# memory while a profiler is attached, so it is off unless asked for: `--features tracy`.
tracy = ["bevy/trace_tracy"]
# Names the commands and components in Bevy's error and warning messages (instead of
# "Enable the debug feature to see the name"): `--features debug`.
debug = ["bevy/debug"]
# The browser build draws through WebGPU instead of WebGL2 (`web/build.sh release webgpu`). Bevy
# picks the backend as it is compiled: a browser without WebGPU gets no picture from this build.
webgpu = ["bevy/webgpu"]
# The browser build tells the page how it is doing (memory, frame rate, what it is about to load and
# how many images and meshes there are), for the page to show after a crash or a page that the
# browser ended: `FEATURES=wasm-debug web/build.sh`. Off, the game sends the page none of it.
wasm-debug = []

[dependencies]
# Not Bevy's defaults: the game uses no glTF, post-processing, anti-aliasing or deferred rendering,
# whose systems would otherwise be registered anyway. The gizmos are drawn (the rain and snow, the
# beaker's rain, the spider's thread, and the debug overlays): `3d_api` has their API only.
bevy = { version = "0.20.0", default-features = false, features = [
    "default_app",
    "default_platform",
    "ui_api",
    "ui_bevy_render",
    "3d_api",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos_render",
    "audio",
    "picking",
    "gamepad",
] }
coll = { path = "../coll" }
loader = { path = "../loader" }
howl = { path = "../howl" }
vehicle = { path = "../vehicle" }
instance = { path = "../instance" }
render = { path = "../render" }
camera = { path = "../camera" }
gte = { path = "../gte" }
net = { path = "../net" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
race = { path = "../race" }
score = { path = "../score" }
math = { path = "../math" }
weapon = { path = "../weapon" }
map = { path = "../map" }
cutscene = { path = "../cutscene" }
# Where a release build keeps its files (`paths.rs`).
directories = "6.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The disc image picker (`disc.rs`). On Linux through the desktop portal (or zenity), which needs
# no GTK to build against.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The system clipboard, for pasting a lobby address.
arboard = { version="3", default-features = false, features = ["wl-clipboard-rs"] }
# The window's icon (`window_icon.rs`), which Bevy has no setting for: Bevy's own winit.
winit = { version = "0.30", default-features = false }

# The program's icon in Explorer and the taskbar (`build.rs`).
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

# The browser build (`web.rs`): the page hands over the disc image, and keeps the settings and the
# maps sent to us; it is told of a panic (`crash.rs`), which goes to the browser's console as well.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
