[package]
name = "realm-server"
version = "0.1.0"
edition = "2024"

# The directory of the public lobbies (see `realm-proto`).
[[bin]]
name = "realm-server"
path = "src/main.rs"

[dependencies]
iroh = "1.4.1"
realm-proto = { path = "../realm-proto" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.54", features = ["rt", "sync", "macros", "time", "signal"] }
