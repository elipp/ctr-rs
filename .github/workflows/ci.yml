name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - run: cargo test --workspace --locked --no-run
      # Compiled in the step above, so the 15 minutes only count the tests running: a hung test fails here.
      - run: cargo test --workspace --locked -- --skip reference
        timeout-minutes: 15

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `ring` (under iroh) compiles C for wasm32, which needs clang and llvm-ar.
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - run: cargo check -p client --target wasm32-unknown-unknown --locked
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
