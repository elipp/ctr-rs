name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The C reference the `needs_reference_` tests compare with, at the commit they expect.
      - id: ctr-native
        run: echo "rev=$(cat docs/ctr-native.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: CTR-tools/ctr-native
          ref: ${{ steps.ctr-native.outputs.rev }}
          path: reference/ctr-native
      # gcc-multilib: the reference drivers are built with `gcc -m32`.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev gcc-multilib
      - run: cargo test --workspace --locked --no-run
      # Compiled in the step above, so the 15 minutes only count the tests running: a hung test fails here.
      # The disc can't be in CI, so its tests are skipped by name; the reference must be there, so
      # CTR_REQUIRE_REFERENCE makes a missing one a failure, not a skip that passes.
      - run: cargo test --workspace --locked -- --skip needs_disc
        timeout-minutes: 15
        env:
          CTR_REQUIRE_REFERENCE: 1

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `ring` (under iroh) compiles C for wasm32, which needs clang and llvm-ar.
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      # Both browser builds, without the dev features, as `web/build.sh dist both` makes them.
      - name: check (webgl2)
        run: cargo check -p client --target wasm32-unknown-unknown --locked --no-default-features
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      - name: check (webgpu)
        run: cargo check -p client --target wasm32-unknown-unknown --locked --no-default-features --features webgpu
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
