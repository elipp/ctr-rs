name: release target

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # `crates/client/build.rs` names the version after the nearest tag.
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - run: cargo dist --locked
      - name: Package
        run: |
          name=ctr-rs-${{ inputs.target }}
          mkdir -p "$name" dist
          if [ "$RUNNER_OS" = Windows ]; then
              cp target/dist/client.exe "$name/ctr-rs.exe"
          elif [ "$RUNNER_OS" = macOS ]; then
              app="$name/ctr-rs.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources" ctr-rs.iconset
              cp target/dist/client "$app/MacOS/ctr-rs"
              cp macos/Info.plist "$app/"
              for size in 16 32 128 256; do
                  sips -z $size $size crates/client/icon.png --out "ctr-rs.iconset/icon_${size}x${size}.png"
              done
              for size in 16 32 128; do
                  sips -z $((size * 2)) $((size * 2)) crates/client/icon.png --out "ctr-rs.iconset/icon_${size}x${size}@2x.png"
              done
              iconutil -c icns -o "$app/Resources/ctr-rs.icns" ctr-rs.iconset
              codesign --force --sign - "$name/ctr-rs.app"
          else
              cp target/dist/client "$name/ctr-rs"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
              # On Windows the files go at the top of the zip, as "Extract All" makes the folder.
              (cd "$name" && 7z a "../dist/$name.zip" .)
          else
              tar czf "dist/$name.tar.gz" "$name"
          fi
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          name=ctr-rs-${{ inputs.target }}
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp "$name/ctr-rs" AppDir/usr/bin/
          ln -s usr/bin/ctr-rs AppDir/AppRun
          cp linux/ctr-rs.desktop AppDir/
          cp crates/client/icon.png AppDir/ctr-rs.png
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "dist/$name.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}
          path: dist/*

  # Apart from the build, as that runs the code of every dependency and this can write to the repository.
  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.target }}
          path: dist
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
