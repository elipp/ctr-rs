name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Not on the job: skipping that would skip the builds that need it, on a manual run too.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  target:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest glibc we build on is the oldest a player's can be.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    uses: ./.github/workflows/release-target.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
