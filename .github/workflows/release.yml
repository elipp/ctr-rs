name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest glibc we build on is the oldest a player's can be.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # `crates/client/build.rs` names the version after the nearest tag.
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - run: cargo dist --locked
      - name: Package
        run: |
          name=ctr-rs-${{ matrix.target }}
          mkdir -p "$name" dist
          if [ "$RUNNER_OS" = Windows ]; then
              cp target/dist/client.exe "$name/ctr-rs.exe"
          else
              cp target/dist/client "$name/ctr-rs"
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md "$name/"
          cp crates/client/fonts/OFL.txt "$name/Inconsolata-OFL.txt"
          if [ "$RUNNER_OS" = Windows ]; then
              # On Windows the files go at the top of the zip, as "Extract All" makes the folder.
              (cd "$name" && 7z a "../dist/$name.zip" .)
          else
              tar czf "dist/$name.tar.gz" "$name"
          fi
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          name=ctr-rs-${{ matrix.target }}
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/ctr-rs
          cp "$name/ctr-rs" AppDir/usr/bin/
          cp "$name"/*.txt "$name"/*.md "$name/LICENSE" AppDir/usr/share/doc/ctr-rs/
          ln -s usr/bin/ctr-rs AppDir/AppRun
          cp linux/ctr-rs.desktop linux/ctr-rs.png AppDir/
          # No FUSE on the runner: the tool (an AppImage itself) unpacks and runs.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "dist/$name.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # A re-run for the same tag replaces the archives in its release, instead of failing on `create`.
      - run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
              gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
