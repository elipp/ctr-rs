<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Added to the Home Screen, the game opens without Safari's bars. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTR-RS">
<title>ctr-rs</title>
<style>
  @font-face {
    font-family: "Press Start 2P";
    src: url("../fonts/PressStart2P-Regular.ttf") format("truetype");
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #ctr { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  /* A focused field under 16px makes iOS zoom the page. At the top, so that iOS has no reason to
     scroll to it. */
  #typing {
    position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0;
    font-size: 16px; opacity: 0; pointer-events: none;
  }
  .touch {
    position: fixed; display: flex; gap: 8px; z-index: 1;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .touch[hidden] { display: none; }
  #touch-game { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); }
  /* Lined up with the console (`console.rs`) on the left. */
  #touch-line {
    left: 0; right: 0; flex-wrap: wrap; box-sizing: border-box;
    padding: 4px max(8px, env(safe-area-inset-right)) 4px max(20px, env(safe-area-inset-left));
  }
  #touch-map { margin-left: auto; }
  .touch button {
    min-width: 44px; height: 44px; padding: 0 10px; touch-action: manipulation;
    font: 10px "Press Start 2P", monospace; color: #fff; background: rgb(16 23 63 / 0.75);
    border: 2px solid; border-color: #7b8ad6 #03050f #03050f #7b8ad6; border-radius: 0;
  }
  .touch button:active { color: #ffd23f; }
  #touch-full svg { display: block; width: 20px; height: 20px; margin: auto; fill: none; stroke: currentColor; stroke-width: 3; }
  #touch-full .exit, #touch-full.on .enter { display: none; }
  #touch-full.on .exit { display: block; }
  #drop {
    position: fixed; inset: 0; display: grid; place-content: center; padding: 16px;
    background: #070a1e; color: #d9ddf2;
    font: 13px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #drop::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgb(0 0 0 / 0.16) 2px 3px);
  }
  #drop h1 {
    position: absolute; left: 24px; top: 20px; margin: 0;
    font: clamp(20px, 5vw, 40px)/1 "Press Start 2P", monospace; letter-spacing: 0.04em;
    text-shadow: 3px 3px 0 #ff5a5a, 6px 6px 0 #03050f;
  }
  #drop h1 a { color: #ffd23f; text-decoration: none; }
  .panel {
    display: grid; justify-items: center; gap: 18px; padding: 24px 28px; text-align: center;
    background: linear-gradient(#1f2a66, #10173f); box-shadow: 0 0 0 2px #03050f, 0 18px 40px rgb(0 0 0 / 0.6);
    border: 2px solid; border-color: #7b8ad6 #03050f #03050f #7b8ad6;
  }
  #drop.over .panel { border-color: #ffd23f; }
  #drop p { margin: 0; }
  #status {
    font: 11px/1.8 "Press Start 2P", monospace; color: #fff; text-shadow: 2px 2px 0 #03050f;
  }
  #drop.over #status { color: #ffd23f; }
  #menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; justify-items: start; }
  #menu li {
    font: 10px/1.6 "Press Start 2P", monospace; color: #8a93c4; cursor: pointer; white-space: pre;
  }
  #menu li::before { content: "  "; }
  #menu li.on { color: #ffd23f; }
  #menu li.on::before { content: "\25B6\00a0"; }
  #menu li.on::after { content: "_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { #menu li.on::after { animation: none; } }
  #drop small { font-size: inherit; color: #8a93c4; }
  #drop.busy #menu, #drop.busy small { visibility: hidden; }
  #detail {
    max-width: min(64ch, calc(100vw - 88px)); max-height: 30vh; overflow: auto; margin: 0;
    padding: 8px 12px; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere;
    color: #ff8a8a; background: rgb(0 0 0 / 0.35); font: inherit;
  }
  #drop input { display: none; }
  #drop.hidden { display: none; }
</style>
</head>
<body>
<canvas id="ctr" tabindex="0"></canvas>
<input id="typing" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
  spellcheck="false" enterkeyhint="send" tabindex="-1" aria-label="Chat or command" disabled>
<div id="touch-game" class="touch" hidden>
  <button type="button" data-key="Escape">Menu</button>
  <button id="touch-full" type="button" aria-label="Full screen" hidden>
    <svg class="enter" viewBox="0 0 20 20" shape-rendering="crispEdges" aria-hidden="true"><path d="M2 7V2H7M13 2H18V7M18 13V18H13M7 18H2V13"/></svg>
    <svg class="exit" viewBox="0 0 20 20" shape-rendering="crispEdges" aria-hidden="true"><path d="M7 2V7H2M18 7H13V2M13 18V13H18M2 13H7V18"/></svg>
  </button>
</div>
<div id="touch-line" class="touch" hidden>
  <button type="button" data-key="ArrowUp" aria-label="Previous">&#8593;</button>
  <button type="button" data-key="ArrowDown" aria-label="Next">&#8595;</button>
  <button type="button" data-key="Tab">Tab</button>
  <button id="touch-paste" type="button">Paste</button>
  <button type="button" data-key="Escape">Close</button>
  <!-- Until there are pickers for these. -->
  <button id="touch-map" type="button" aria-label="Next map">Map</button>
  <button id="touch-racer" type="button" aria-label="Next racer">Racer</button>
</div>
<div id="drop">
  <h1><a href="../">CTR-RS</a></h1>
  <div class="panel">
    <p id="status">Drop Crash Team Racing (USA) .bin or .chd</p>
    <pre id="detail" hidden></pre>
    <ul id="menu" role="menu"></ul>
    <small id="note">It stays on this device.</small>
    <input type="file" accept=".bin,.chd">
  </div>
</div>
<script>
// `/config set render-scale`: the game sizes its picture by this ratio, and the page stretches it
// to the canvas. Without the exact size that the browser can report, it has to go by the ratio. A
// change is told as the browser tells of a moved window's, on the query the game listens to.
let renderScale = 1;
try {
  const scale = JSON.parse(localStorage.getItem("ctr-rs.config"))?.render_scale;
  if (scale >= 0.25 && scale <= 1) renderScale = scale;
} catch (e) {
  console.warn(`could not read the render scale: ${e}`);
}
const screenRatio = Object.getOwnPropertyDescriptor(window, "devicePixelRatio").get.bind(window);
Object.defineProperty(window, "devicePixelRatio", { get: () => screenRatio() * renderScale });
delete ResizeObserverEntry.prototype.devicePixelContentBoxSize;
let ratioQuery = null;
const matchMedia = window.matchMedia.bind(window);
window.matchMedia = (query) => {
  const list = matchMedia(query);
  const ratio = /resolution:\s*([\d.]+)dppx/.exec(query);
  if (ratio === null) return list;
  ratioQuery = list;
  // (The real one goes by the screen, which the scale does not change.)
  return new Proxy(list, {
    get(target, name) {
      if (name === "matches") return Math.abs(Number(ratio[1]) - devicePixelRatio) < 0.001;
      const value = target[name];
      return typeof value === "function" ? value.bind(target) : value;
    },
  });
};
window.ctrSetRenderScale = (scale) => {
  renderScale = scale;
  ratioQuery?.dispatchEvent(new Event("change"));
};

// Sound only starts after a key or click, so the game's audio contexts are resumed on one.
// Must run before the game (`client-*.js`) is imported.
const audio = [];
window.AudioContext = new Proxy(window.AudioContext, {
  construct(target, args) {
    const context = new target(...args);
    audio.push(context);
    return context;
  },
});
// iOS would have its Silent Mode mute the game.
if (navigator.audioSession) navigator.audioSession.type = "playback";
// (iOS only counts a touch as a gesture when it ends, and it can interrupt a context that was
// running at any time, as when the page is left: this keeps listening.)
const unlocked = new WeakSet();
function resume() {
  for (const context of audio) {
    if (context.state === "running" || context.state === "closed") continue;
    context.resume();
    if (!unlocked.has(context)) {
      unlocked.add(context);
      const silence = context.createBufferSource();
      silence.buffer = context.createBuffer(1, 1, context.sampleRate);
      silence.connect(context.destination);
      silence.start();
    }
  }
}
for (const name of ["keydown", "pointerdown", "pointerup", "touchend", "click"]) {
  addEventListener(name, resume, true);
}
</script>
<script type="module">
// The builds of the game here, one for each way of drawing: `web/build.sh` puts the ones it made
// in this list.
const BUILT = ["webgl2"];
// WebGL2, unless `?backend=webgpu` asks for the WebGPU build (or it is the only one made). WebGPU is
// opt-in for now: it has been the less dependable of the two, and WebKit's WGSL compiler (Safari,
// and every browser on iOS) holds to the spec where Chrome's and naga's do not, and rejects Bevy's
// PBR shader for its texture-typed `let`s.
const asked = new URLSearchParams(location.search).get("backend");
const backend = (async () => {
  if (asked != null) {
    if (BUILT.includes(asked)) {
      return asked;
    }
    console.warn(`ctr-rs: backend=${asked} asked for, but the builds here are ${BUILT.join(", ")}`);
  }
  return BUILT.includes("webgl2") ? "webgl2" : BUILT[0];
})();

// The game's code is fetched and compiled from the start, while the player picks the disc and it is
// read; `init` falls back to fetching it itself if that fails.
const compiled = backend
  .then((b) => WebAssembly.compileStreaming(fetch(new URL(`client-${b}_bg.wasm`, import.meta.url))))
  .catch((e) => {
    console.warn(`could not compile the game ahead: ${e}`);
    return null;
  });

const drop = document.getElementById("drop");
const status = document.getElementById("status");
const menu = document.getElementById("menu");
const input = drop.querySelector("input");
let disc = null;

window.ctrCopy = (text) =>
  navigator.clipboard.writeText(text).catch((e) => console.warn(`could not copy: ${e}`));
let pasted = null;
window.ctrPaste = () =>
  navigator.clipboard.readText().then(
    (text) => (pasted = text),
    (e) => console.warn(`could not paste: ${e}`),
  );
window.ctrTakePasted = () => {
  const text = pasted;
  pasted = null;
  return text;
};

// A touch screen has no keys, so the buttons press them on the canvas, where the game listens. An
// on-screen keyboard only opens for a field focused during the tap itself, and what it types does
// not come as reliable key presses: the line is the hidden field's, which the game reads whole.
const canvas = document.getElementById("ctr");
const typing = document.getElementById("typing");
const touchGame = document.getElementById("touch-game");
const touchLine = document.getElementById("touch-line");
const hasTouch = navigator.maxTouchPoints > 0 || matchMedia("(any-pointer: coarse)").matches;
let lineOpen = false;
let menuOpen = false;
let typed = null;
let consoleArea = null;
// (The line takes all key presses while it is open, so these are not keys.)
let levelStep = 0;
let racerStep = 0;

const KEY_CODES = { Enter: 13, Escape: 27, Tab: 9, ArrowUp: 38, ArrowDown: 40, PageUp: 33, PageDown: 34 };
function pressKey(code) {
  for (const type of ["keydown", "keyup"]) {
    canvas.dispatchEvent(
      new KeyboardEvent(type, { code, key: code, keyCode: KEY_CODES[code], bubbles: true, cancelable: true }),
    );
  }
}

function placeTouchLine() {
  const view = visualViewport;
  touchLine.style.top = `${view.offsetTop + view.height - touchLine.offsetHeight}px`;
}
visualViewport.addEventListener("resize", placeTouchLine);
visualViewport.addEventListener("scroll", placeTouchLine);

function showTouchLine() {
  touchLine.hidden = !(hasTouch && lineOpen);
  if (!touchLine.hidden) placeTouchLine();
}

function openLine() {
  lineOpen = true;
  showTouchLine();
  typing.value = "";
  typed = null;
  typing.disabled = false;
  typing.focus();
  pressKey("Enter");
}

window.ctrShowLine = (open, text, menu) => {
  menuOpen = menu;
  if (typing.value !== text) typing.value = text;
  if (open === lineOpen) return;
  lineOpen = open;
  showTouchLine();
  if (!open) {
    typing.blur();
    typing.disabled = true;
    canvas.focus();
    if (restoreFullscreen) enterFullscreenAgain();
  }
};
window.ctrTakeTyped = () => {
  const text = typed;
  typed = null;
  return text;
};
window.ctrTakeLevelStep = () => {
  const step = levelStep;
  levelStep = 0;
  return step;
};
window.ctrTakeRacerStep = () => {
  const step = racerStep;
  racerStep = 0;
  return step;
};
// How far up from the page's bottom the game has to keep clear of the keyboard and the buttons.
window.ctrKeyboardInset = () =>
  lineOpen && hasTouch ? innerHeight - touchLine.getBoundingClientRect().top + 4 : 0;
window.ctrConsoleArea = (left, top, right, bottom) => (consoleArea = { left, top, right, bottom });

// (Kept from taking the focus, which would close the keyboard.)
for (const button of document.querySelectorAll(".touch button")) {
  button.tabIndex = -1;
  button.addEventListener("mousedown", (e) => e.preventDefault());
  if (button.dataset.key) button.addEventListener("click", () => pressKey(button.dataset.key));
}
document.getElementById("touch-map").addEventListener("click", () => levelStep++);
document.getElementById("touch-racer").addEventListener("click", () => racerStep++);
document.getElementById("touch-paste").addEventListener("click", () => window.ctrPaste());

typing.addEventListener("input", () => (typed = typing.value));
typing.addEventListener("keydown", (e) => {
  if (e.isComposing || !(e.code in KEY_CODES || e.key === "Enter")) return;
  e.preventDefault();
  pressKey(e.key === "Enter" ? "Enter" : e.code);
});
// The keyboard was dismissed, or the game was tapped.
typing.addEventListener("blur", () => lineOpen && pressKey("Escape"));

const inConsole = (x, y) =>
  consoleArea !== null &&
  x >= consoleArea.left && x <= consoleArea.right && y >= consoleArea.top && y <= consoleArea.bottom;

// The console opens the line when it is tapped, in the touch's end as that is when the keyboard is
// allowed to open. (The game has to wait for its next frame, which is too late for that.)
const TAP_SLOP = 10;
let tapStart = null;
canvas.addEventListener("touchstart", (e) => {
  const touch = e.touches[0];
  tapStart = e.touches.length === 1 && inConsole(touch.clientX, touch.clientY) ? touch : null;
});
canvas.addEventListener("touchend", (e) => {
  const start = tapStart;
  tapStart = null;
  if (start === null || lineOpen || menuOpen) return;
  const end = e.changedTouches[0];
  if (Math.hypot(end.clientX - start.clientX, end.clientY - start.clientY) > TAP_SLOP) return;
  e.preventDefault();
  openLine();
});
// A tap on the open console is not one on the game, which would take the focus and close the line.
addEventListener("pointerdown", (e) => {
  if (e.target === canvas && lineOpen && inConsole(e.clientX, e.clientY)) e.stopPropagation();
}, true);

// The game reads no pad without the focus (`Pads`), and a controller can move the browser's focus
// around, or to its own bars. Only a tap on the console is for the text field, which stays
// disabled until then.
function refocus() {
  if (drop.classList.contains("hidden") && !lineOpen && document.hasFocus()) canvas.focus();
}
canvas.addEventListener("blur", () => setTimeout(refocus));
addEventListener("focus", refocus);

// The whole page, for the buttons and the text field to stay. (Safari on iOS 16.3 or older only
// has the prefixed names, and an iPhone has none.)
const fullButton = document.getElementById("touch-full");
const root = document.documentElement;
const enterFullscreen = root.requestFullscreen ?? root.webkitRequestFullscreen;
const exitFullscreen = document.exitFullscreen ?? document.webkitExitFullscreen;
const isFullscreen = () => (document.fullscreenElement ?? document.webkitFullscreenElement) != null;
const isHomeScreenApp =
  navigator.standalone === true || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
// Safari leaves full screen for the on-screen keyboard, so it is asked for again when the line
// closes. It needs a recent tap or key for that: failing that, the next tap brings it back.
let restoreFullscreen = false;
function enterFullscreenAgain() {
  enterFullscreen.call(root)?.then(() => (restoreFullscreen = false)).catch(() => {});
}
fullButton.hidden = !enterFullscreen || isHomeScreenApp;
fullButton.addEventListener("click", () => {
  restoreFullscreen = false;
  const asked = isFullscreen() ? exitFullscreen.call(document) : enterFullscreen.call(root);
  asked?.catch((e) => console.warn(`could not change to full screen: ${e}`));
});
addEventListener("touchend", (e) => {
  if (!restoreFullscreen || lineOpen || fullButton.contains(e.target)) return;
  const touch = e.changedTouches[0];
  if (e.target === canvas && inConsole(touch.clientX, touch.clientY)) return;
  enterFullscreenAgain();
}, true);
for (const name of ["fullscreenchange", "webkitfullscreenchange"]) {
  document.addEventListener(name, () => {
    fullButton.classList.toggle("on", isFullscreen());
    fullButton.setAttribute("aria-label", isFullscreen() ? "Exit full screen" : "Full screen");
    if (isFullscreen()) restoreFullscreen = false;
    else if (lineOpen) restoreFullscreen = true;
    if (!lineOpen) canvas.focus();
  });
}

const CONFIG = "ctr-rs.config";
window.ctrLoadConfig = () => {
  try {
    return localStorage.getItem(CONFIG);
  } catch (e) {
    console.warn(`could not read the settings: ${e}`);
    return null;
  }
};
window.ctrSaveConfig = (text) => {
  try {
    localStorage.setItem(CONFIG, text);
    return null;
  } catch (e) {
    return String(e);
  }
};
// Moves the settings to where the game no longer reads them (and the next ones do not overwrite
// them): a game they make crash, or cannot read, starts again with the defaults.
const CONFIG_ASIDE = `${CONFIG}.broken`;
function setConfigAside() {
  try {
    const text = localStorage.getItem(CONFIG);
    if (text === null) return null;
    localStorage.setItem(CONFIG_ASIDE, text);
    localStorage.removeItem(CONFIG);
    return null;
  } catch (e) {
    return String(e);
  }
}
window.ctrSetConfigAside = setConfigAside;

// The game reads the image from here (a wasm program's memory never shrinks, so it is not copied
// in), and lets go of it once it has taken what it needs.
window.ctrDiscSize = () => disc.length;
window.ctrReadDisc = (at, buf) => buf.set(disc.subarray(at, at + buf.length));
window.ctrReleaseDisc = () => {
  disc = null;
};

async function read(stream, size) {
  const bytes = new Uint8Array(size);
  const reader = stream.getReader();
  let at = 0;
  let shown = -1;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    bytes.set(value, at);
    at += value.length;
    const percent = Math.floor((at * 100) / size);
    if (percent !== shown) {
      status.textContent = `Reading ${percent}%`;
      shown = percent;
    }
  }
  return bytes;
}

// `copy` is the file to keep a copy of, where the browser cannot remember a file's place
// (`showOpenFilePicker`). Once the game has started on it, so as not to keep a wrong one.
async function start(stream, size, copy = null) {
  if (drop.classList.contains("busy")) return;
  drop.classList.add("busy");
  disc = await read(stream, size);
  trackPictures = await stored("trackPictures", "readonly", (s) => s.getAll()).catch((e) => {
    console.warn(`could not read the pictures of the tracks: ${e}`);
    return [];
  });
  maps = await stored("maps", "readonly", (s) => s.getAll()).catch((e) => {
    console.warn(`could not read the maps: ${e}`);
    return [];
  });
  status.textContent = "Starting";
  try {
    const drawsWith = await backend;
    console.info(`ctr-rs: drawing through ${drawsWith}: client-${drawsWith}.js, of ${BUILT.join(", ")}`);
    // The fast GPU of a machine with two. Bevy asks WebGPU for it, but wgpu creates the WebGL2
    // context without asking: this one is made first, and a canvas hands wgpu the context it
    // already has (with the attributes it was made with, so wgpu's own `antialias: false` too). A
    // canvas with a WebGL2 context has no WebGPU one, so WebGPU is left to Bevy.
    if (drawsWith === "webgl2") {
      canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance" });
    }
    const { default: init } = await import(`./client-${drawsWith}.js`);
    const module = await compiled;
    await init(module === null ? undefined : { module_or_path: module });
  } catch (e) {
    // winit hands the event loop to the browser by throwing.
    if (!String(e).includes("Using exceptions for control flow")) {
      console.error(e);
      crashed(String(e));
      return;
    }
  }
  if (crash !== null) return;
  drop.classList.add("hidden");
  canvas.focus();
  touchGame.hidden = !hasTouch;
  keepAwake();
  if (copy !== null) remember(copy).then(() => navigator.storage?.persist?.());
}

// The screen stays on while the game runs, which a race driven with a pad (no keys or mouse for the
// system to see) would not. The browser lets go of the lock when the page is hidden, so it is
// asked for again when the page is back; a crash lets go of it (`crashed`).
let wakeLock = null;
let askingWakeLock = false;
async function keepAwake() {
  const running = drop.classList.contains("hidden") && crash === null;
  if (!running || !navigator.wakeLock || document.visibilityState !== "visible") return;
  if (askingWakeLock || (wakeLock !== null && !wakeLock.released)) return;
  askingWakeLock = true;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    if (crash !== null) wakeLock.release().catch(() => {});
  } catch (e) {
    console.warn(`could not keep the screen on: ${e}`);
  } finally {
    askingWakeLock = false;
  }
}
document.addEventListener("visibilitychange", keepAwake);

let crash = null;
function crashed(message) {
  if (crash !== null) return;
  crash = message;
  wakeLock?.release().catch(() => {});
  const starting = !drop.classList.contains("hidden");
  audio.forEach((context) => context.close().catch(() => {}));
  document.activeElement?.blur();
  touchGame.hidden = touchLine.hidden = true;
  drop.classList.remove("hidden", "busy", "over");
  document.getElementById("detail").textContent = message;
  document.getElementById("detail").hidden = false;
  document.getElementById("note").hidden = true;
  let kept = false;
  try {
    kept = localStorage.getItem(CONFIG) !== null;
  } catch {}
  offer(starting ? "The game could not start" : "The game crashed", [
    ["Restart", () => location.reload()],
    ...(kept ? [["Restart with default settings", () => {
      const e = setConfigAside();
      if (e !== null) console.warn(`could not set the settings aside: ${e}`);
      location.reload();
    }]] : []),
    ...(starting ? [["Pick another .bin", () => forget().then(() => location.reload())]] : []),
    ["Copy the error", copyCrash],
  ]);
}
function copyCrash() {
  navigator.clipboard.writeText(`ctr-rs crashed\n\n${crash}\n\n${navigator.userAgent}`).then(
    () => (status.textContent = "The error is copied"),
    (e) => console.warn(`could not copy: ${e}`),
  );
}
window.ctrCrashed = crashed;
const trap = (error) => error instanceof WebAssembly.RuntimeError && crashed(String(error));
addEventListener("error", (e) => trap(e.error));
addEventListener("unhandledrejection", (e) => trap(e.reason));

function stored(name, mode, use) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open("ctr-rs", 3);
    open.onupgradeneeded = () => {
      for (const store of ["handles", "maps", "trackPictures"]) {
        if (!open.result.objectStoreNames.contains(store)) open.result.createObjectStore(store);
      }
    };
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const request = use(open.result.transaction(name, mode).objectStore(name));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    };
  });
}

const remember = (handle) => stored("handles", "readwrite", (s) => s.put(handle, "disc")).catch(() => {});
const forget = () => stored("handles", "readwrite", (s) => s.delete("disc")).catch(() => {});
const recall = () => stored("handles", "readonly", (s) => s.get("disc")).catch(() => undefined);

let maps = [];
let trackPictures = [];
window.ctrTakeTrackPictures = () => {
  const taken = trackPictures;
  trackPictures = [];
  return taken;
};
window.ctrSaveTrackPicture = (key, bytes) => {
  // `bytes` views wasm memory, which can move.
  const copy = bytes.slice();
  stored("trackPictures", "readwrite", (s) => s.put(copy, key)).catch((e) =>
    console.warn(`could not keep the picture of the track: ${e}`),
  );
};
window.ctrTakeMaps = () => {
  const taken = maps;
  maps = [];
  return taken;
};
window.ctrSaveMap = (key, bytes) => {
  // `bytes` views wasm memory, which can move.
  const copy = bytes.slice();
  stored("maps", "readwrite", (s) => s.put(copy, key)).catch((e) =>
    console.warn(`could not keep the map: ${e}`),
  );
};
window.ctrPurgeMaps = () => {
  for (const store of ["maps", "trackPictures"]) {
    stored(store, "readwrite", (s) => s.clear()).catch((e) =>
      console.warn(`could not delete the ${store}: ${e}`),
    );
  }
};

let choices = [];
let on = 0;

function offer(text, list) {
  status.textContent = text;
  choices = list;
  menu.replaceChildren(
    ...list.map(([label], i) => {
      const item = document.createElement("li");
      item.textContent = label;
      item.setAttribute("role", "menuitem");
      item.addEventListener("pointerenter", () => select(i));
      item.addEventListener("click", () => take(i));
      return item;
    }),
  );
  select(0);
}

function select(i) {
  on = i;
  [...menu.children].forEach((item, j) => item.classList.toggle("on", j === i));
}

function take(i) {
  if (!drop.classList.contains("busy")) choices[i]?.[1]();
}

addEventListener("keydown", (e) => {
  if (drop.classList.contains("busy") || drop.classList.contains("hidden")) return;
  const n = choices.length;
  if (e.code === "ArrowUp" || e.code === "KeyW") select((on + n - 1) % n);
  else if (e.code === "ArrowDown" || e.code === "KeyS") select((on + 1) % n);
  else if (e.code === "Enter" || e.code === "NumpadEnter" || e.code === "Space") take(on);
  else return;
  e.preventDefault();
});

// Once the game runs, a file dropped on the page is the game's: a map (`.ctrmap`).
let dropped = [];
window.ctrTakeDropped = () => {
  const taken = dropped;
  dropped = [];
  return taken;
};
addEventListener("dragover", (e) => {
  if (drop.classList.contains("hidden")) e.preventDefault();
});
addEventListener("drop", async (e) => {
  if (!drop.classList.contains("hidden")) return;
  e.preventDefault();
  for (const file of e.dataTransfer.files) {
    dropped.push([file.name, new Uint8Array(await file.arrayBuffer())]);
  }
});

function fresh() {
  offer("Drop Crash Team Racing (USA) .bin or .chd", [["Or pick it", pick]]);
}

async function pick() {
  if (!window.showOpenFilePicker) return input.click();
  let handle;
  try {
    [handle] = await showOpenFilePicker({
      types: [{ description: "Disc image", accept: { "application/octet-stream": [".bin", ".chd"] } }],
    });
  } catch {
    return;
  }
  await remember(handle);
  openHandle(handle);
}

function startKept(kept) {
  start(kept.stream(), kept.size).catch(async (e) => {
    console.warn(`could not read the kept disc image: ${e}`);
    await forget();
    drop.classList.remove("busy");
    offer(`${kept.name} could not be read`, [["Pick it again", pick]]);
  });
}

async function allow(handle) {
  if ((await handle.requestPermission({ mode: "read" })) === "granted") return openHandle(handle);
  await forget();
  fresh();
}

async function openHandle(handle) {
  let file;
  try {
    file = await handle.getFile();
  } catch {
    await forget();
    offer(`${handle.name} is not where it was`, [["Pick it again", pick]]);
    return;
  }
  start(file.stream(), file.size);
}

drop.addEventListener("dragover", (e) => {
  e.preventDefault();
  drop.classList.add("over");
});
drop.addEventListener("dragleave", (e) => {
  if (!drop.contains(e.relatedTarget)) drop.classList.remove("over");
});
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  const item = [...e.dataTransfer.items].find((item) => item.kind === "file");
  if (!item) return;
  const file = item.getAsFile();
  item.getAsFileSystemHandle?.().then((handle) => handle?.kind === "file" && remember(handle));
  start(file.stream(), file.size, item.getAsFileSystemHandle ? null : file);
});
input.addEventListener("change", () => {
  const file = input.files[0];
  if (file) start(file.stream(), file.size, file);
});

fresh();
const saved = await recall();
if (saved instanceof Blob) {
  offer(`${saved.name} was kept from last time`, [
    ["Continue with it", () => startKept(saved)],
    ["Pick another .bin", pick],
  ]);
} else if (saved) {
  if ((await saved.queryPermission({ mode: "read" })) === "granted") {
    openHandle(saved);
  } else {
    offer(`${saved.name} was used last time`, [
      ["Continue with it", () => allow(saved)],
      ["Pick another .bin", pick],
    ]);
  }
}
</script>
