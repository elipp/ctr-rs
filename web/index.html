<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ctr-rs</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #ctr { display: block; width: 100%; height: 100%; outline: none; }
  #drop {
    position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
    gap: 16px; background: #000; color: #8c8c8c; text-align: center;
    font: 12px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  #drop p { margin: 0; }
  #drop.over #status { color: #fff; }
  #menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; justify-items: start; }
  #menu li { color: #5a5a5a; cursor: pointer; white-space: pre; }
  #menu li::before { content: "  "; }
  #menu li.on { color: #fff; }
  #menu li.on::before { content: "> "; }
  #menu li.on::after { content: "_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { #menu li.on::after { animation: none; } }
  #drop small { font-size: inherit; color: #4a4a4a; }
  #drop.busy #menu, #drop.busy small { visibility: hidden; }
  #drop input { display: none; }
  #drop.hidden { display: none; }
</style>
</head>
<body>
<canvas id="ctr" tabindex="0"></canvas>
<div id="drop">
  <p id="status">Drop Crash Team Racing (USA) .bin</p>
  <ul id="menu" role="menu"></ul>
  <small>It stays on this computer.</small>
  <input type="file" accept=".bin">
</div>
<script>
// Sound only starts after a key or click, so the game's audio contexts are resumed on one.
// Must run before client.js is imported.
const audio = [];
window.AudioContext = new Proxy(window.AudioContext, {
  construct(target, args) {
    const context = new target(...args);
    audio.push(context);
    return context;
  },
});
const gestures = ["keydown", "pointerdown", "touchend"];
function resume() {
  audio.forEach((context) => context.state === "suspended" && context.resume());
  if (audio.length > 0 && audio.every((context) => context.state === "running")) {
    gestures.forEach((name) => removeEventListener(name, resume, true));
  }
}
gestures.forEach((name) => addEventListener(name, resume, true));
</script>
<script type="module">
import init from "./client.js";

const drop = document.getElementById("drop");
const status = document.getElementById("status");
const menu = document.getElementById("menu");
const input = drop.querySelector("input");
let disc = null;

window.ctrCopy = (text) =>
  navigator.clipboard.writeText(text).catch((e) => console.warn(`could not copy: ${e}`));
let pasted = null;
window.ctrPaste = () =>
  navigator.clipboard.readText().then(
    (text) => (pasted = text),
    (e) => console.warn(`could not paste: ${e}`),
  );
window.ctrTakePasted = () => {
  const text = pasted;
  pasted = null;
  return text;
};

window.ctrTakeDisc = () => {
  const taken = disc;
  disc = null;
  return taken;
};

async function read(stream, size) {
  const bytes = new Uint8Array(size);
  const reader = stream.getReader();
  let at = 0;
  let shown = -1;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    bytes.set(value, at);
    at += value.length;
    const percent = Math.floor((at * 100) / size);
    if (percent !== shown) {
      status.textContent = `Reading ${percent}%`;
      shown = percent;
    }
  }
  return bytes;
}

async function start(stream, size) {
  if (drop.classList.contains("busy")) return;
  drop.classList.add("busy");
  disc = await read(stream, size);
  status.textContent = "Starting";
  try {
    await init();
  } catch (e) {
    // winit hands the event loop to the browser by throwing.
    if (!String(e).includes("Using exceptions for control flow")) {
      status.textContent = "Could not start. Is it the USA disc? (See the console)";
      throw e;
    }
  }
  drop.classList.add("hidden");
  document.getElementById("ctr").focus();
}

function handles(mode, use) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open("ctr-rs", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("handles");
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const request = use(open.result.transaction("handles", mode).objectStore("handles"));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    };
  });
}
const remember = (handle) => handles("readwrite", (s) => s.put(handle, "disc")).catch(() => {});
const forget = () => handles("readwrite", (s) => s.delete("disc")).catch(() => {});
const recall = () => handles("readonly", (s) => s.get("disc")).catch(() => undefined);

let choices = [];
let on = 0;

function offer(text, list) {
  status.textContent = text;
  choices = list;
  menu.replaceChildren(
    ...list.map(([label], i) => {
      const item = document.createElement("li");
      item.textContent = label;
      item.setAttribute("role", "menuitem");
      item.addEventListener("pointerenter", () => select(i));
      item.addEventListener("click", () => take(i));
      return item;
    }),
  );
  select(0);
}

function select(i) {
  on = i;
  [...menu.children].forEach((item, j) => item.classList.toggle("on", j === i));
}

function take(i) {
  if (!drop.classList.contains("busy")) choices[i]?.[1]();
}

addEventListener("keydown", (e) => {
  if (drop.classList.contains("busy") || drop.classList.contains("hidden")) return;
  const n = choices.length;
  if (e.code === "ArrowUp" || e.code === "KeyW") select((on + n - 1) % n);
  else if (e.code === "ArrowDown" || e.code === "KeyS") select((on + 1) % n);
  else if (e.code === "Enter" || e.code === "NumpadEnter" || e.code === "Space") take(on);
  else return;
  e.preventDefault();
});

function fresh() {
  offer("Drop Crash Team Racing (USA) .bin", [["Or pick it", pick]]);
}

async function pick() {
  if (!window.showOpenFilePicker) return input.click();
  let handle;
  try {
    [handle] = await showOpenFilePicker({
      types: [{ description: "Disc image", accept: { "application/octet-stream": [".bin"] } }],
    });
  } catch {
    return;
  }
  await remember(handle);
  openHandle(handle);
}

async function allow(handle) {
  if ((await handle.requestPermission({ mode: "read" })) === "granted") return openHandle(handle);
  await forget();
  fresh();
}

async function openHandle(handle) {
  let file;
  try {
    file = await handle.getFile();
  } catch {
    await forget();
    offer(`${handle.name} is not where it was`, [["Pick it again", pick]]);
    return;
  }
  start(file.stream(), file.size);
}

drop.addEventListener("dragover", (e) => {
  e.preventDefault();
  drop.classList.add("over");
});
drop.addEventListener("dragleave", (e) => {
  if (!drop.contains(e.relatedTarget)) drop.classList.remove("over");
});
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  const item = [...e.dataTransfer.items].find((item) => item.kind === "file");
  if (!item) return;
  const file = item.getAsFile();
  item.getAsFileSystemHandle?.().then((handle) => handle?.kind === "file" && remember(handle));
  start(file.stream(), file.size);
});
input.addEventListener("change", () => {
  const file = input.files[0];
  if (file) start(file.stream(), file.size);
});

fresh();
const handle = await recall();
if (handle) {
  if ((await handle.queryPermission({ mode: "read" })) === "granted") {
    openHandle(handle);
  } else {
    offer(`${handle.name} was used last time`, [
      ["Continue with it", () => allow(handle)],
      ["Pick another .bin", pick],
    ]);
  }
}
</script>
</body>
</html>
