# Allowlist for the Claude sandbox. Add a domain here and rebuild (`sandbox/claude.sh --build`).
# `docker logs claude-proxy` shows what was allowed (TCP_TUNNEL) and what was refused (TCP_DENIED).

http_port 3128

acl claude_domains dstdomain api.anthropic.com console.anthropic.com platform.claude.com claude.ai
acl crates_domains dstdomain crates.io index.crates.io static.crates.io
acl pypi_domains dstdomain pypi.org files.pythonhosted.org
acl tls_port port 443
acl connect method CONNECT

http_access allow connect tls_port claude_domains
http_access allow connect tls_port crates_domains
http_access allow connect tls_port pypi_domains
http_access deny all

# A forwarding proxy only: nothing is cached, and no client addresses are passed on.
cache deny all
forwarded_for delete
via off

access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /tmp
pinger_enable off
